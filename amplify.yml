version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Create .env.production from Amplify env vars for runtime
        - echo "APP_PASSWORD=$APP_PASSWORD" > .env.production
        - echo "OPENROUTER_API_KEY=$OPENROUTER_API_KEY" >> .env.production
        - echo "OPENROUTER_MODEL=$OPENROUTER_MODEL" >> .env.production
        - echo "Created .env.production with APP_PASSWORD + OpenRouter config"
        - npm run build
        # Copy .env.production into standalone output so the Lambda server can read it
        - cp .env.production .next/standalone/.env.production 2>/dev/null || true
        - echo "Copied .env.production to standalone server"
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

